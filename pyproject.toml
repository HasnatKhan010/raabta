[build-system]
requires = ["setuptools==84.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "raabta-ir"
version = "0.1.0"
description = "Script-aware evidence retrieval for Roman-Urdu questions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Hasnat Khan" }]
license = { text = "TBD before public release" }
dependencies = [
  "datasets==3.1.0",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "PyYAML==6.0.2",
  "rank-bm25==0.2.2",
  "scikit-learn==1.5.2",
  "sentence-transformers==3.3.1",
  "transformers==4.46.3",
  "truststore==0.10.4",
  "uroman==1.3.1.1",
  "fastapi==0.115.5",
  "pydantic==2.10.2",
  "uvicorn==0.32.1",
  "psutil==6.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Formatter intentionally leaves long URLs, messages, and notebook code intact.
