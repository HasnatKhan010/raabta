name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest httpx
          pip install --no-deps --no-build-isolation -e .

      - name: Run unit tests
        run: |
          pytest tests/test_preprocessing.py tests/test_chunking.py tests/test_metrics.py tests/test_selection.py -v
        env:
          PYTHONPATH: src

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff==0.8.1

      - name: Ruff check
        run: ruff check src/ backend/ tests/ scripts/

      - name: Ruff format check
        run: ruff format --check src/ backend/ tests/ scripts/
